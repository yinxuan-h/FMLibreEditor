# FM27 on Game Pass / Microsoft Store, 0.9.2562.0, the update of 24 November 2026, worked out by `fmlibre-probe profile`
# on a save of 4 August 2027, where all 12 checks passed. The statics moved 0x1FE0 back from 0.9.2524.0's, each kept at
# its distance from the players pair, so the guesses from that build held the retirement manager and the game's own
# object. The object layout is 0.9.2524.0's.
name = "FM27 0.9.2562.0 (Game Pass)"
edition = 27
storefront = "gamePass"
package_version = "0.9.2562.0"

# The in-game date, 2027-08-04 on the save: 3788 of 3788 contract dates before it, and 78 of 78 current injuries
# begun by then and not over. Another value, at 0x53CC958, held it too.
current_date = 0x539BD10

# The static pointer to the retirement manager (RETIREMENT_MANAGER),
# 0xD2E8 before the players pair as in 0.9.2524.0; 576 planned retirements on the save.
retirement_manager = 0x53EBBC0

# The static pointer to the game's one GAME_UI object, whose count of saves loaded tells a load from a save (1 loaded
# on the save): 0xBB8 after the players pair, as in 0.9.2524.0. Another static, at 0x53E79C0, points at it too.
game_ui = 0x53F9A60

# The static pointers to the tactics the human managers keep for their teams (TACTICS_MANAGER, 0xD0 after the
# retirement manager's, as before) and to the training manager (TRAINING_MANAGER), which keeps the history of
# training of their players: each the one pointer in the plugin to the one object of its class.
tactics_manager = 0x53EBC90
training_manager = 0x53E8228

# The prize money competitions pay (layout.toml, [prize_money]; #123) was read on this build on a save of August 2027:
# 482 settings, 458 held by a stage. The Champions League's league phase pays the 36 places from £10,222,480 to
# £236,234, £1,803,967 per win and £601,323 per draw, the Libertadores £244,877 per win and the Süper Lig £114,699,
# £57,964 and £1,229 per win, draw and loss: to the pound what 0.9.2524.0 read.
prize_money = true

# A club's sponsorship deals (layout.toml, [sponsorship]; #114) read as on 0.9.2524.0: West Ham United's nine and
# Beşiktaş's three, each entry's total its amount per season times its years. Not compared with the game's screen.
sponsorships = true

# The rules competitions register their squads under (layout.toml, [rules]) read as on 0.9.2524.0, on the save the
# season's turn was followed on there: 426 competitions with squad rules, and the Süper Lig's six for 2027 and 2028
# what that build read on the save after the turn (20 / 6 / 4 / 5 / 2 / 40 and 20 / 10 / 4 / 5 / 2 / 40).
squad_rules = true

# game_plugin as mapped in memory; these values identify the build.
[plugin]
size_of_image = 0x17624000
link_timestamp = 0x6AFF583B

# RVAs in game_plugin of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x53F8EA8
staff = 0x53F8EF0
clubs = 0x53F9060

# RVAs of the pairs of the arrays of national teams' containers (docs/recon/fm27-national-teams.md): 0xA8 and 0xC0
# past the players pair as in 0.9.2524.0.
[national_teams]
men = 0x53F8F50
women = 0x53F8F68

# What this build lays out otherwise than layout.toml, as 0.9.2524.0 does.
[layout.club_finance]
corporate = 0x8AD

[layout.tactics]
tactics = 0x1018
current = 0x1030
